services:
  app:
    build: .
    environment:
      APP_ENV: local
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ferremax
      DB_USERNAME: ferremax
      DB_PASSWORD: ferremax
    volumes:
      - app_storage:/var/www/storage
    depends_on:
      db:
        condition: service_healthy
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/public:ro
    depends_on:
      - app
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ferremax
      MYSQL_USER: ferremax
      MYSQL_PASSWORD: ferremax
      MYSQL_ROOT_PASSWORD: local_root_ferremax
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uferremax", "-pferremax"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  db_data:
  app_storage:
